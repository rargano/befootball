<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ทีม | beFootball</title>
    <link rel="stylesheet" href="/public/assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container masthead">
        <a class="brand" href="index.html"><span class="brand-ball">be</span><span><strong>beFootball</strong><small>ข่าวฟุตบอลภาษาไทย</small></span></a>
        <a class="admin-zone-link" href="admin.html">Admin Zone</a>
      </div>
      <nav class="main-nav">
        <div class="container nav-scroll">
          <a href="index.html">หน้าแรก</a>
          <a href="news.html">ข่าวประจำวัน</a>
          <a href="rumors.html">ข่าวลือ</a>
          <a href="standings.html">ตารางคะแนน</a>
          <a class="active" href="teams.html">ทีม</a>
          <a href="leagues.html">ลีก</a>
        </div>
      </nav>
    </header>
    <main class="container detail-layout" id="teamDetail">
      <section class="panel page-card">
        <div class="team-header">
          <span class="crest red large" id="teamDetailCrest">FC</span>
          <div>
            <p class="breadcrumb" id="teamDetailMeta"><a href="teams.html">ทีม</a> / Premier League</p>
            <h1 id="teamDetailName">กำลังโหลดทีม</h1>
            <p id="teamDetailSummary">โหลดข้อมูลทีมจาก standings ล่าสุด</p>
          </div>
        </div>
        <div class="stat-strip" id="teamDetailStats"></div>
        <div class="tabs-static" id="teamDetailTabs">
          <a class="active" href="#team-news" data-team-tab="team-news">ข่าว</a>
          <a href="#team-rumors" data-team-tab="team-rumors">ข่าวลือ</a>
          <a href="#team-fixtures" data-team-tab="team-fixtures">โปรแกรม</a>
        </div>
        <div class="team-tab-panel active" id="team-news"></div>
        <div class="team-tab-panel" id="team-rumors"></div>
        <div class="team-tab-panel" id="team-fixtures"></div>
      </section>
      <aside class="sidebar">
        <section class="side-card">
          <div class="side-title"><h2>นักเตะเด่น</h2><span>PLAYER</span></div>
          <div class="mini-list" id="teamPlayersList"><span class="empty-copy">กำลังโหลด roster</span></div>
        </section>
      </aside>
    </main>
    <footer class="footer"><div class="container footer-inner"><strong>beFootball</strong><span>Team detail</span></div></footer>
    <script type="module" src="/src/controllers/home-controller.js"></script>
    <script type="module" src="/src/controllers/ui-controller.js"></script>
  </body>
</html>
