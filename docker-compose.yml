services:
  nextjs:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8088/api

  php-fpm:
    image: php:8.3-fpm
    working_dir: /app/backend
    volumes:
      - .:/app
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - .:/app
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: befootball
      MYSQL_USER: befootball
      MYSQL_PASSWORD: befootball
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data:
